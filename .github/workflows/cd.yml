name: Build and Publish Docker Image (GHCR)

on:
  push:
    branches:
      - development
      - main
      - master
  workflow_dispatch: # Permite que você rode manualmente clicando no botão azul

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permissão vital para salvar a imagem no seu perfil

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile  # Usa o arquivo da sua raiz
          platforms: linux/amd64
          push: true
          # Forçamos o nome para minúsculo para evitar erros de registro
          tags: |
            ghcr.io/${{ github.repository_owner }}/woofed-crm:latest
            ghcr.io/${{ github.repository_owner }}/woofed-crm:${{ github.sha }}
