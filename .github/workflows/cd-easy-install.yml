name: Continuous Deployment (GHCR)

on:
  push:
    branches:
      - development
      - main
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ESTE PASSO É O SEGREDO: Ele pega 'BigCreditos' e cria 'bigcreditos'
      - name: Lowercase Repo
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # IMPORTANTE: Verifique se o seu Dockerfile está na raiz ou na pasta docker/
          # Se der erro de "file not found", mude para: file: docker/easy-install/Dockerfile
          file: ./Dockerfile 
          platforms: linux/amd64
          push: true
          # Usamos a variável limpa (REPO_LOWER) aqui
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/woofed-crm:latest
            ghcr.io/${{ env.REPO_LOWER }}/woofed-crm:${{ github.sha }}
