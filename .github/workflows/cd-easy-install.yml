name: Continuous Deployment Easy Install

on:
  push:
    branches:
      - development # Ou a branch que você está usando

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Importante para salvar no seu perfil
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/easy-install/Dockerfile
          push: true
          # Isso cria a imagem no SEU repositório
          tags: |
            ghcr.io/${{ github.repository_owner }}/woofed-crm-easy:latest
