name: CI RSpec Tests

on:
  pull_request:
  push:
    branches:
      - development

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    container:
      image: ruby:3.3.4

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "password"
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'true'

      - uses: actions/setup-node@v1
        with:
          node-version: '22.13.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Load Env variables
        uses: cardinalby/export-env-action@v1
        with:
          envFile: '.env.github'    
          expand: 'true'

      - name: Install System Dependencies
        run: |
          apt-get update -qq
          apt-get install -y --fix-missing libnss3-dev libgdk-pixbuf2.0-dev libgtk-3-dev libxss-dev libasound2 sudo xvfb

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
          sh -c 'echo "deb http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          apt-get update && apt-get install -y google-chrome-stable

      - name: Bundle install
        run: |
          gem install bundler -v 2.4.22
          bundle install --jobs 4 --retry 3 --path vendor/bundle

      - name: Install yarn
        run: npm install -g yarn

      - name: Build JS and CSS
        run: |
          yarn install
          yarn build

      - name: Setup Database
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load
        env:
          RAILS_ENV: test
          DATABASE_URL: "postgres://postgres:password@postgres:5432/postgres"

      - name: Setup assets
        run: RAILS_ENV=test SECRET_KEY_BASE_DUMMY=1 bundle exec rails assets:precompile
        
      - name: Run tests
        run: bundle exec rspec
        env:
          RAILS_ENV: test
          DATABASE_URL: "postgres://postgres:password@postgres:5432/postgres"

      - name: Change owner
        run: chown -R root:root .