name: Build and Push Woofed CRM

on:
  push:
    branches:
      - development
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A vacina para o erro de letras maiúsculas
      - name: Lowercase Repo
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Usando a variável minúscula para não dar erro
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/woofedcrm:latest
            ghcr.io/${{ env.REPO_LOWER }}/woofedcrm:${{ github.sha }}
